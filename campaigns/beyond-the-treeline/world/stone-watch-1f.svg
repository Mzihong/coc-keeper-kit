<text x="402.00" y="81.00" font-size="12" font-weight="bold">①</text>
<text x="420.60" y="81.00" font-size="12" fill="#8a8a85">(PL ①)</text>
<text x="472.20" y="81.00" font-size="12">门楣先民纹,谁也认不得</text>
<text x="402.00" y="106.00" font-size="12" font-weight="bold">②</text>
<text x="420.60" y="106.00" font-size="12" font-style="italic">墙角一小块刻痕断在半路,笔法和满墙其余的</text>
<text x="420.60" y="123.00" font-size="12" font-style="italic">不是一路——像是谁刻到一半没再刻下去(见</text>
<text x="420.60" y="140.00" font-size="12" font-style="italic">timeline.md 「The blank eight</text>
<text x="420.60" y="157.00" font-size="12" font-style="italic">hundred years」)</text>
<text x="402.00" y="182.00" font-size="12" font-weight="bold">③</text>
<text x="420.60" y="182.00" font-size="12" font-style="italic">刻痕全在后来砌的灰石头上,没一道刻在灰砂</text>
<text x="420.60" y="199.00" font-size="12" font-style="italic">石原墙上——凿不动</text>
<text x="402.00" y="224.00" font-size="12" font-weight="bold">④</text>
<text x="420.60" y="224.00" font-size="12" font-style="italic">水位四百年没变过,冬天也不结冰——井壁深</text>
<text x="420.60" y="241.00" font-size="12" font-style="italic">处常年渗着细流,没人查过通向哪里</text>
<text x="40" y="350.00" font-size="11" fill="#444">哨堂西门 = 唯一正门;灶房南门只通柴垛,常年闩死</text>

<text x="288.40" y="224.40" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold">6</text>
<line x1="356.00" y1="78.00" x2="356.00" y2="56.00" stroke="#1a1a1a" stroke-width="1.5"/>
<polyline points="351.00,63.00 356.00,54.00 361.00,63.00" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="356.00" y="50.00" text-anchor="middle" font-size="11">N</text>
<line x1="382.00" y1="68.00" x2="382.00" y2="371.00" stroke="#c9c9c4" stroke-width="1"/>
<text x="402.00" y="81.00" font-size="12" font-weight="bold">①</text>
<text x="420.60" y="81.00" font-size="12" font-style="italic">不灭的火终年亮着,不用添油,风灌得再大也不</text>
<text x="420.60" y="98.00" font-size="12" font-style="italic">熄</text>
<text x="402.00" y="123.00" font-size="12" font-weight="bold">②</text>
<text x="420.60" y="123.00" font-size="12" font-style="italic">死镜边角一块凝水裂了,底下露出一截石中筋</text>
<text x="420.60" y="140.00" font-size="12" font-style="italic">——偶尔没人看时,镜面会自己亮一下</text>
<text x="402.00" y="165.00" font-size="12" font-weight="bold">③</text>
<text x="420.60" y="165.00" font-size="12" font-style="italic">石面上有一道扇形的浅痕,像什么东西定期在</text>
<text x="420.60" y="182.00" font-size="12" font-style="italic">这儿转过、又停下——痕迹只扫过墙上先民纹</text>
<text x="420.60" y="199.00" font-size="12" font-style="italic">的一角,不是整圈</text>
<text x="402.00" y="224.00" font-size="12" font-weight="bold">④</text>
<text x="420.60" y="224.00" font-size="12" font-style="italic">两端手柄的木箍磨得发亮,其余零件却锈得很</text>
<text x="420.60" y="241.00" font-size="12" font-style="italic">——像是一直有人在用</text>
<text x="402.00" y="266.00" font-size="12" font-weight="bold">⑤</text>
<text x="420.60" y="266.00" font-size="12" font-style="italic">手柄座上刻着几行先民纹,笔画利落,和门楣上</text>
<text x="420.60" y="283.00" font-size="12" font-style="italic">风化模糊的那批不是一路——像是四百一十二</text>
<text x="420.60" y="300.00" font-size="12" font-style="italic">年前重新点亮此处的那队人,识着字照描刻上</text>
<text x="420.60" y="317.00" font-size="12" font-style="italic">去的</text>
<text x="402.00" y="342.00" font-size="12" font-weight="bold">⑥</text>
<text x="420.60" y="342.00" font-size="12" font-style="italic">墙缝里露出一截石中筋,裹着不腐皮;伸手摸过</text>
<text x="420.60" y="359.00" font-size="12" font-style="italic">的人都说它是温的,哪怕是隆冬</text>
<text x="40" y="423.00" font-size="11" fill="#444">望室 = 两人份的岗;双手廊两端的手柄必须同时转,一个人够不着两头</text>
</svg>
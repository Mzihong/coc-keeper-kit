<text x="67.60" y="215.20" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold">1</text>
<circle cx="237.80" cy="114.00" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="237.80" y="114.00" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold">2</text>
